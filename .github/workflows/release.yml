name: Release

# Ao publicar uma release (ex.: v1.0.0), builda o plugin e anexa o artefato
# instalável à própria release. O usuário baixa o zip da release e instala no
# Obsidian sem precisar buildar.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  plugin-artifact:
    name: Build e anexa o plugin na release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Empacota o artefato do plugin
        run: |
          cd build
          zip "../markupp-plugin-${{ github.event.release.tag_name }}.zip" \
            main.js manifest.json styles.css

      - name: Anexa os arquivos na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "markupp-plugin-${{ github.event.release.tag_name }}.zip" \
            build/main.js build/manifest.json build/styles.css \
            --clobber
